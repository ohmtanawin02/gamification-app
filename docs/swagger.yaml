basePath: /
definitions:
  dto.ClaimRewardRequest:
    properties:
      reward_id:
        minimum: 1
        type: integer
    required:
    - reward_id
    type: object
  dto.LoginRequest:
    properties:
      nickname:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - nickname
    type: object
  dto.SpinRequest:
    properties:
      points_earned:
        minimum: 1
        type: integer
    required:
    - points_earned
    type: object
host: localhost:9393
info:
  contact: {}
  description: Gamification Web App API
  title: Gamification API
  version: "1.0"
paths:
  /api/v1/games-histories:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Filter by nickname
        in: query
        name: nickname
        type: string
      - description: asc or desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get game histories
      tags:
      - histories
  /api/v1/games/spin:
    post:
      consumes:
      - application/json
      parameters:
      - description: Points earned (300, 500, 1000, 3000)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SpinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "422":
          description: Unprocessable Entity
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Spin the wheel to earn points
      tags:
      - games
  /api/v1/rewards:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Search by name
        in: query
        name: search
        type: string
      - description: asc or desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get all rewards
      tags:
      - rewards
  /api/v1/rewards/claim:
    post:
      consumes:
      - application/json
      parameters:
      - description: Reward ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ClaimRewardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "409":
          description: Conflict
        "422":
          description: Unprocessable Entity
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Claim a reward
      tags:
      - rewards
  /api/v1/user-rewards:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Filter by nickname
        in: query
        name: nickname
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get claimed rewards by user
      tags:
      - rewards
  /api/v1/users:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Filter by nickname
        in: query
        name: nickname
        type: string
      - description: asc or desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - users
  /api/v1/users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get current user profile with rewards
      tags:
      - users
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Nickname
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Login or register
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
